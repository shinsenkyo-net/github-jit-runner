name: build

# Pull requests (including forks) build and test only, with a read-only token.
# Pushes to main and version tags publish to GHCR with build provenance.
#
# Runner image tags (VARIANT suffix "" or -macos-sdk<SDK version>):
#   v<tag>-runner<RUNNER_VERSION>-ubuntu<version><suffix>   on a v* tag
#   sha-<commit><suffix>, main<suffix>
# RUNNER_VERSION and the Ubuntu version come from vm/Dockerfile; the SDK version
# from the SDK the build unpacked. The dispatcher image keeps plain v<tag>.
# GitHub-hosted runners only; this repository never uses self-hosted runners.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n launch.sh dispatch.sh test.sh vm/entrypoint.sh vm/guest/jit-run
      - run: ./test.sh   # jq and yq are preinstalled on ubuntu-24.04

  image:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {name: github-jit-runner, context: vm, variant: base}       # per-job VM (QEMU + guest disk)
          - {name: github-jit-runner, context: vm, variant: macos-sdk}  # same, with Apple's macOS SDK
          - {name: github-jit-dispatcher, context: ., variant: base}    # dispatch.sh + launch.sh
    permissions:
      contents: read
      packages: write      # used only outside pull requests (see `push:`)
      id-token: write      # provenance attestation
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for the VM disk image
        if: matrix.name == 'github-jit-runner'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Unpack the SDK once; the image build below reuses this stage from the builder cache.
      - if: matrix.variant == 'macos-sdk'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: vm
          target: macos-sdk-version
          outputs: type=local,dest=${{ runner.temp }}/macos-sdk
      - id: version
        env:
          NAME: ${{ matrix.name }}
          VARIANT: ${{ matrix.variant }}
          SDK_DIR: ${{ runner.temp }}/macos-sdk
        run: |
          version= variant=
          if [[ $NAME == github-jit-runner ]]; then
            runner=$(sed -n 's/^ARG RUNNER_VERSION=//p' vm/Dockerfile)
            ubuntu=$(sed -n 's/^ARG UBUNTU=ubuntu:\([0-9.]*\)@sha256:.*/\1/p' vm/Dockerfile)
            [[ $runner =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $ubuntu =~ ^[0-9]+\.[0-9]+$ ]] ||
              { echo "cannot read RUNNER_VERSION/UBUNTU from vm/Dockerfile" >&2; exit 1; }
            version=-runner$runner-ubuntu$ubuntu
          fi
          if [[ $VARIANT == macos-sdk ]]; then
            sdk=$(<"$SDK_DIR/VERSION")
            [[ $sdk =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "bad SDK version: $sdk" >&2; exit 1; }
            variant=-macos-sdk$sdk
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "variant=$variant" >>"$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,suffix=${{ steps.version.outputs.variant }}
            type=ref,event=tag,suffix=${{ steps.version.outputs.version }}${{ steps.version.outputs.variant }}
            type=raw,value=main,enable={{is_default_branch}},suffix=${{ steps.version.outputs.variant }}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.context == 'vm' && format('VARIANT={0}', matrix.variant) || '' }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
